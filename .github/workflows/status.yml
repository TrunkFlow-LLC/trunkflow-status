name: Public service status
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: public-status
  cancel-in-progress: false
jobs:
  check:
    if: vars.TRUNKFLOW_STATUS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the reviewed public-only configuration
        run: |
          ! grep -q 'REPLACE_WITH_' .upptimerc.yml
          test ! -d src
          test ! -d supabase
          test ! -f package.json
      - name: Upptime history and public incidents
        uses: upptime/uptime-monitor@v1.44.1
        continue-on-error: true
        with:
          command: update
        env:
          GH_PAT: ${{ github.token }}
      - name: Produce only public availability and freshness data
        run: node probe.mjs
      - name: Save the public check timestamp for future failed checks
        run: |
          git config user.name 'TrunkFlow status automation'
          git config user.email 'status-bot@users.noreply.github.com'
          git add site/status.json
          git diff --cached --quiet || git commit -m 'Update public status freshness'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
